wbb:
  name: wehoop-wbb-data
  # sportsdataverse/wehoop-wbb-data BUILDS the data but publishes it as release
  # assets on sportsdataverse/sportsdataverse-data, under one tag per dataset.
  # Confirmed 2026-09-18 against wehoop-wbb-data/docs/datasets/*.md.
  release_base: "https://github.com/sportsdataverse/sportsdataverse-data/releases/download"
  release_tags:
    pbp: espn_womens_college_basketball_pbp
    team_box: espn_womens_college_basketball_team_boxscores
    player_box: espn_womens_college_basketball_player_boxscores
    shots: espn_womens_college_basketball_shots
    game_rosters: espn_womens_college_basketball_game_rosters
  file_stems:
    pbp: play_by_play
    team_box: team_box
    player_box: player_box
    shots: shots
    game_rosters: game_rosters
  # game_rosters carries an explicit starter flag, which is what seeds each
  # period's five. Without it lineup reconstruction has nothing to start from.
  datasets: [pbp, team_box, player_box, game_rosters]
  # Season end-year: 2026 == the completed 2025-26 season. 2027 is not published
  # yet. pbp is ~50-90 MB per season as parquet, not the 1-2 GB the raw feed is.
  seasons: [2024, 2025, 2026]
  raw_path: data/raw/wbb

maac:
  # Verified 2026-09-18: all 13 match ESPN's home_team_name/away_team_name
  # exactly in the 2026 pbp feed.
  teams:
    - Canisius
    - Fairfield
    - Iona
    - Manhattan
    - Marist
    - Merrimack
    - Mount St. Mary's
    - Niagara
    - Quinnipiac
    - Rider
    - Sacred Heart
    - Saint Peter's
    - Siena
